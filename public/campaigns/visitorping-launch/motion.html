<!doctype html><html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#070f0d;color:#f5fbf8;font-family:Arial,sans-serif;width:1080px;height:1080px;overflow:hidden}.canvas{padding:70px;height:100%;position:relative}.brand{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:800}.brand img{width:44px;height:44px;object-fit:contain}h1{font-size:90px;letter-spacing:-5px;line-height:1.03;max-width:920px;margin:65px 0 32px}em{font-style:normal;color:#34d399}.sub{font-size:31px;line-height:1.45;max-width:700px;color:#bdcec6}.notification{margin-top:55px;padding:32px;border:1px solid #416454;border-radius:24px;background:#14271e;max-width:750px}.notification strong{display:block;color:#34d399;font-size:25px;margin-bottom:16px}.notification p{font-size:32px;margin:0}.note{font-size:19px;color:#a6bcb0;margin-top:16px}.product{position:absolute;right:66px;bottom:90px;width:625px;max-height:610px;object-fit:contain}.footer{position:absolute;bottom:52px;left:70px;right:70px;display:flex;justify-content:space-between;font-size:25px}.cta{background:#34d399;color:#08170f;display:inline-block;padding:22px 32px;border-radius:12px;font-size:28px;font-weight:700;margin-top:40px}.hidden{display:none}</style><div class="canvas"><div class="brand"><img src="assets/logo.png">VisitorPing</div><h1 id="headline"></h1><div class="sub" id="sub"></div><div id="notice" class="notification"><strong>VisitorPing · now</strong><p>A visitor is on your website.</p><div class="note">Illustrative notification</div></div><img id="product" class="product hidden" src="assets/product-demo.png"><div id="cta" class="cta hidden">See how it works →</div><div class="footer"><span>visitorping.com</span><span id="label">Website activity. In your pocket.</span></div></div><script>window.frame=t=>{let phase=t<3?0:t<7?1:t<12?2:3;document.getElementById('headline').innerHTML=['Your website gets<br>a visitor.','Your iPhone<br><em>pings.</em>','Follow the visit.<br><em>Live.</em>','Keep building.<br><em>Stay in the loop.</em>'][phase];document.getElementById('sub').style.display=phase===2?'none':'block';document.getElementById('sub').textContent=['You put your website out into the world.','Notice website activity without keeping a dashboard open.','VisitorPing’s interactive preview.','Live visitor activity and iPhone notifications.'][phase];document.getElementById('notice').classList.toggle('hidden',phase!==1);document.getElementById('product').classList.toggle('hidden',phase!==2);document.getElementById('cta').classList.toggle('hidden',phase!==3);document.getElementById('label').textContent=phase===2?'Example data':'Website activity. In your pocket.'};window.frame(4);if(location.search.includes('variant=b')){document.getElementById('headline').innerHTML='Still refreshing<br><em>your analytics?</em>';document.getElementById('sub').textContent='Keep building. Let website visitor notifications come to your iPhone.';}</script></html>
