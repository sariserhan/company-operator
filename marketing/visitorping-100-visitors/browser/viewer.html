<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisitorPing publishing browser</title><style>body{margin:0;background:#111827;color:#f9fafb;font:16px system-ui}header{max-width:1100px;margin:auto;padding:14px 16px}p{margin:8px 0;color:#cbd5e1;font-size:14px}button{padding:9px 14px;margin-right:8px;border:0;border-radius:6px;cursor:pointer}#view{display:block;width:min(1100px,100%);height:auto;margin:auto;outline:2px solid transparent}#view:focus{outline-color:#34d399}#state{font-size:13px}</style><header><strong>Sign in to WordPress.org</strong><p>This is a dedicated browser on your server. Click the page below to type. Sign in to the WordPress.org account that should own the VisitorPing plugin. Login and verification stay in this browser; do not send passwords in chat.</p><button id="reload">Reload page</button><button id="done">I've finished signing in</button><span id="state">Connecting…</span></header><img id="view" tabindex="0" alt="Remote browser screen"><script>
const view=document.querySelector('#view'),state=document.querySelector('#state');let stopped=false;
let actions=Promise.resolve();function send(event){actions=actions.then(()=>fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)}));return actions}
async function refresh(){try{const r=await fetch('/frame');if(!r.ok)throw Error();const image=URL.createObjectURL(await r.blob()),old=view.src;view.src=image;if(old.startsWith('blob:'))URL.revokeObjectURL(old);if(!stopped)state.textContent='Connected'}catch{state.textContent='Browser is loading…'}setTimeout(refresh,600)}refresh();
view.addEventListener('click',e=>{view.focus();const r=view.getBoundingClientRect();send({type:'click',x:(e.clientX-r.left)*view.naturalWidth/r.width,y:(e.clientY-r.top)*view.naturalHeight/r.height})});
view.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();send({type:'key',key:'Control+A'});return}if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();send({type:'text',text:e.key});return}if(['Enter','Tab','Backspace','Delete','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();send({type:'key',key:e.key==='Tab'&&e.shiftKey?'Shift+Tab':e.key})}});
view.addEventListener('paste',e=>{e.preventDefault();send({type:'text',text:e.clipboardData.getData('text/plain')})});
view.addEventListener('wheel',e=>{e.preventDefault();send({type:'wheel',dy:e.deltaY})},{passive:false});
document.querySelector('#reload').onclick=()=>send({type:'reload'});
document.querySelector('#done').onclick=async()=>{await send({type:'done'});stopped=true;state.textContent='Marked ready. You can return to the chat.'};
</script></html>
